
name: Deploy World of Erasia to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldofearisia-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Verify build output
        run: test -s dist/index.html

      - name: Pack dist into site.tar.gz
        run: |
          set -euo pipefail
          tar -czf site.tar.gz -C dist .
          ls -lh site.tar.gz

      - name: Check VPS and target directory
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -eu
            TARGET="/var/www/worldoferasia.stephennicholasjones.com/public"

            test -d "$TARGET"
            test "$(realpath "$TARGET")" = "$TARGET"
            test "$(stat -c '%U' "$TARGET")" = "deploy-web"
            test -w "$TARGET"

            echo "=== Filesystem ==="
            df -h "$TARGET"
            df -ih "$TARGET"
            echo "=== Target permissions verified ==="

      - name: Upload archive
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: site.tar.gz
          target: ${{ secrets.VPS_TARGET_DIR }}
          overwrite: true

      - name: Extract and deploy site
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -eu
            TARGET="/var/www/worldoferasia.stephennicholasjones.com/public"
            ARCHIVE="$TARGET/site.tar.gz"

            test -d "$TARGET"
            test "$(realpath "$TARGET")" = "$TARGET"
            test -s "$ARCHIVE"

            # Remove only the previous top-level site contents,
            # preserving the uploaded archive until extraction.
            find "$TARGET" -mindepth 1 -maxdepth 1 \
              ! -name 'site.tar.gz' -exec rm -rf -- {} +

            tar -xzf "$ARCHIVE" -C "$TARGET"
            rm -f "$ARCHIVE"

            test -s "$TARGET/index.html"

            echo "=== Deployed files ==="
            ls -lah "$TARGET"
            echo "=== Disk usage ==="
            df -h "$TARGET"

      - name: Check public HTTP site
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              http://worldoferasia.stephennicholasjones.com/ \
              --output /dev/null; then
              echo "HTTP check passed."
              exit 0
            fi
            sleep 3
          done

          echo "HTTP check failed."
          exit 1
