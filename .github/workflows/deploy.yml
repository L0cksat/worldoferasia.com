name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # SSH connectivity + write/space probe
      - name: Probe VPS target directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            TARGET="${{ secrets.VPS_TARGET_DIR }}"
            echo "TARGET=${TARGET}"
            mkdir -p "${TARGET}"
            touch "${TARGET}/.deploy-write-test" && rm -f "${TARGET}/.deploy-write-test"
            echo "=== disk usage ==="
            df -h
            echo "=== inode usage ==="
            df -ih
            echo "=== target ==="
            ls -lad "${TARGET}"

      # rsync syncs dist/ → VPS_TARGET_DIR (requires free disk space on the VPS)
      - name: Deploy dist/ to VPS via rsync
        uses: Burnett01/rsync-deployments@8.0.0
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.VPS_TARGET_DIR }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_key_pass: ${{ secrets.VPS_SSH_PASSPHRASE }}
