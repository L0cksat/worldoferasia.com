name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Probe VPS disk + target
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            TARGET="${{ secrets.VPS_TARGET_DIR }}"
            echo "TARGET=${TARGET}"
            mkdir -p "${TARGET}"
            touch "${TARGET}/.deploy-write-test" && rm -f "${TARGET}/.deploy-write-test"
            echo "=== df -h ==="
            df -h
            echo "=== df -ih ==="
            df -ih
            ls -lad "${TARGET}"

      # Plain rsync (no third-party Docker deploy action) for clearer errors
      - name: Setup SSH key for rsync
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          # Unlock passphrase-protected key without typing (SSH_ASKPASS)
          export VPS_SSH_PASSPHRASE
          ASKPASS="$(mktemp)"
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$VPS_SSH_PASSPHRASE"' > "$ASKPASS"
          chmod 700 "$ASKPASS"

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          DISPLAY=none SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force \
            setsid -w ssh-add ~/.ssh/deploy_key
          rm -f "$ASKPASS"
          ssh-add -l

      - name: Rsync dist/ to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
        run: |
          set -euo pipefail
          test -d dist
          echo "Local dist size:"
          du -sh dist
          rsync -avz --delete --stats \
            -e "ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./dist/ \
            "${VPS_USER}@${VPS_HOST}:${VPS_TARGET_DIR}/"
          echo "Deploy finished."
